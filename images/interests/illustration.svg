<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <!-- Illustration & Drawing -->
  <rect width="600" height="450" rx="14" fill="#FAF4EB"/>
  <rect x="20" y="20" width="560" height="410" rx="10" fill="#F4ECE0" stroke="#E2D5C3" stroke-width="1.5"/>

  <!-- 畫架與調色盤插畫元素 -->
  <g transform="translate(180, 80)">
    <circle cx="120" cy="110" r="85" fill="#E06D44" opacity="0.15"/>
    <ellipse cx="120" cy="110" rx="90" ry="60" fill="#FFFDF8" stroke="#2B2521" stroke-width="2.5"/>
    <!-- 調色盤孔洞與顏料 -->
    <ellipse cx="60" cy="110" rx="14" ry="12" fill="#FAF4EB" stroke="#2B2521" stroke-width="2"/>
    <circle cx="105" cy="80" r="10" fill="#E06D44"/>
    <circle cx="140" cy="80" r="10" fill="#F4D35E"/>
    <circle cx="165" cy="105" r="10" fill="#5F9EA0"/>
    <circle cx="145" cy="135" r="10" fill="#9C6644"/>
    <!-- 畫筆 -->
    <path d="M 50 170 L 190 50" stroke="#2B2521" stroke-width="6" stroke-linecap="round"/>
    <path d="M 175 62 L 200 40" stroke="#E06D44" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- 手寫標籤與提示 -->
  <g transform="translate(50, 310)">
    <rect width="500" height="85" rx="8" fill="#FFFDF9" stroke="#E8DFD3" stroke-width="1"/>
    <text x="250" y="32" font-family="'Noto Sans TC', sans-serif" font-size="16" font-weight="bold" fill="#2B2521" text-anchor="middle">
      [ 繪畫與插畫示意圖 PLACEHOLDER ]
    </text>
    <text x="250" y="55" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#75675A" text-anchor="middle">
      可放入個人角色手繪、人體速寫或電繪插畫作品
    </text>
    <text x="250" y="73" font-family="'Courier New', monospace" font-size="10" fill="#A89887" text-anchor="middle">
      PATH: images/interests/illustration.png
    </text>
  </g>
</svg>

