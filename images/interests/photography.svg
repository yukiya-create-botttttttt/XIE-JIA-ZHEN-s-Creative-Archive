<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <!-- Photography & Visuals -->
  <rect width="600" height="450" rx="14" fill="#FAF4EB"/>
  <rect x="20" y="20" width="560" height="410" rx="10" fill="#F4ECE0" stroke="#E2D5C3" stroke-width="1.5"/>

  <!-- 復古底片相機與觀景窗元素 -->
  <g transform="translate(180, 75)">
    <!-- 機身 -->
    <rect x="0" y="40" width="240" height="150" rx="12" fill="#2B2521"/>
    <!-- 頂部轉盤與快門 -->
    <rect x="30" y="24" width="40" height="16" rx="2" fill="#5A4E44"/>
    <rect x="180" y="28" width="26" height="12" rx="2" fill="#E06D44"/>
    <rect x="95" y="16" width="50" height="24" rx="4" fill="#3D352E"/>
    <circle cx="120" cy="28" r="6" fill="#FFFDF8"/>

    <!-- 鏡頭大圓 -->
    <circle cx="120" cy="115" r="55" fill="#3D352E" stroke="#5A4E44" stroke-width="5"/>
    <circle cx="120" cy="115" r="42" fill="#1E1916"/>
    <circle cx="120" cy="115" r="28" fill="#2B2521"/>
    <!-- 鏡頭反光 -->
    <path d="M 100 95 Q 115 88 135 95" fill="none" stroke="#E06D44" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 提示標籤 -->
  <g transform="translate(50, 310)">
    <rect width="500" height="85" rx="8" fill="#FFFDF9" stroke="#E8DFD3" stroke-width="1"/>
    <text x="250" y="32" font-family="'Noto Sans TC', sans-serif" font-size="16" font-weight="bold" fill="#2B2521" text-anchor="middle">
      [ 攝影與光影示意圖 PLACEHOLDER ]
    </text>
    <text x="250" y="55" font-family="'Noto Sans TC', sans-serif" font-size="12" fill="#75675A" text-anchor="middle">
      可放入個人日常街拍、光影記錄、底片攝影或靜物人像攝影
    </text>
    <text x="250" y="73" font-family="'Courier New', monospace" font-size="10" fill="#A89887" text-anchor="middle">
      PATH: images/interests/photography.png
    </text>
  </g>
</svg>

