<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <!-- WORK 01: AI & Future Technology -->
  <rect width="800" height="520" rx="14" fill="#FAF5ED"/>
  <rect x="25" y="25" width="750" height="470" rx="10" fill="#F3EAE0" stroke="#DFD1BF" stroke-width="2"/>

  <!-- 科技與繪本視覺意象 -->
  <g transform="translate(140, 70)">
    <!-- 繪本書冊開展形狀 -->
    <path d="M 60 190 Q 260 170 260 50 Q 260 170 460 190 L 460 270 Q 260 250 260 130 Q 260 250 60 270 Z" fill="#FFFDF8" stroke="#2B2521" stroke-width="2.5"/>
    <!-- 人形 AI 與人類情感心形微光 -->
    <circle cx="260" cy="110" r="30" fill="#E06D44" opacity="0.2"/>
    <circle cx="260" cy="110" r="16" fill="#E06D44"/>
    <path d="M 245 110 L 275 110" stroke="#FFF" stroke-width="2.5"/>
    <circle cx="210" cy="180" r="24" fill="#E8DFD3" stroke="#2B2521" stroke-width="2"/>
    <circle cx="310" cy="180" r="24" fill="#2B2521"/>
    <!-- 情感連結弧線 -->
    <path d="M 225 170 Q 260 140 295 170" fill="none" stroke="#E06D44" stroke-width="3" stroke-dasharray="5,3"/>
  </g>

  <!-- 印章徽章 -->
  <g transform="translate(620, 50) rotate(10)">
    <rect width="90" height="32" rx="4" fill="#E06D44"/>
    <text x="45" y="21" font-family="'Helvetica Neue', sans-serif" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">WORK 01</text>
  </g>

  <!-- 提示框 -->
  <g transform="translate(80, 360)">
    <rect width="640" height="95" rx="8" fill="#FFFDF9" stroke="#E5D9CB" stroke-width="1.5"/>
    <text x="320" y="32" font-family="'Noto Sans TC', sans-serif" font-size="17" font-weight="bold" fill="#2B2521" text-anchor="middle">
      [ 作品封面示意圖 PLACEHOLDER ]
    </text>
    <text x="320" y="58" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#75675A" text-anchor="middle">
      AI 與未來科技繪本｜角色設定稿 / 繪本雙頁跨頁圖
    </text>
    <text x="320" y="80" font-family="'Courier New', monospace" font-size="11" fill="#A89887" text-anchor="middle">
      建議圖片路徑：images/works/work01-ai-book.png
    </text>
  </g>
</svg>

