<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <!-- WORK 05: Tainan Beef Soup Website (台南牛肉湯推廣網站) -->
  <rect width="800" height="520" rx="14" fill="#FAF5ED"/>
  <rect x="25" y="25" width="750" height="470" rx="10" fill="#F3EAE0" stroke="#DFD1BF" stroke-width="2"/>

  <!-- 瀏覽器視窗與熱氣騰騰牛肉湯意象 -->
  <g transform="translate(160, 55)">
    <!-- 瀏覽器視窗外框 -->
    <rect x="0" y="20" width="480" height="200" rx="8" fill="#FFFDF8" stroke="#2B2521" stroke-width="2.5"/>
    <rect x="0" y="20" width="480" height="32" rx="8" fill="#EAE0D3"/>
    <!-- 視窗控制紅黃綠小圓 -->
    <circle cx="20" cy="36" r="5" fill="#E06D44"/>
    <circle cx="36" cy="36" r="5" fill="#F4D35E"/>
    <circle cx="52" cy="36" r="5" fill="#5F9EA0"/>
    <!-- 網址列示意 -->
    <rect x="80" y="26" width="300" height="20" rx="4" fill="#FFFDF8"/>
    <text x="95" y="40" font-family="'Courier New', monospace" font-size="10" fill="#A89887">https://tainan-beef-soup.art</text>

    <!-- 視窗內頁面排版 (湯碗與熱氣標誌) -->
    <ellipse cx="240" cy="145" rx="55" ry="35" fill="#2B2521"/>
    <ellipse cx="240" cy="140" rx="50" ry="28" fill="#E06D44"/>
    <!-- 熱氣蒸騰線條 -->
    <path d="M 215 105 Q 220 90 215 75" fill="none" stroke="#E06D44" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 240 100 Q 245 85 240 70" fill="none" stroke="#E06D44" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 265 105 Q 270 90 265 75" fill="none" stroke="#E06D44" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 側邊文字與跑者圖案 -->
    <text x="320" y="130" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="bold" fill="#2B2521">台南清晨路跑 × 牛肉湯</text>
    <text x="320" y="152" font-family="'Courier New', monospace" font-size="10" fill="#E06D44">CULTURE & TASTE</text>
  </g>

  <!-- 印章徽章 -->
  <g transform="translate(620, 50) rotate(5)">
    <rect width="90" height="32" rx="4" fill="#7A6850"/>
    <text x="45" y="21" font-family="'Helvetica Neue', sans-serif" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">WORK 05</text>
  </g>

  <!-- 提示框 -->
  <g transform="translate(80, 360)">
    <rect width="640" height="95" rx="8" fill="#FFFDF9" stroke="#E5D9CB" stroke-width="1.5"/>
    <text x="320" y="32" font-family="'Noto Sans TC', sans-serif" font-size="17" font-weight="bold" fill="#2B2521" text-anchor="middle">
      [ 作品封面示意圖 PLACEHOLDER ]
    </text>
    <text x="320" y="58" font-family="'Noto Sans TC', sans-serif" font-size="13" fill="#75675A" text-anchor="middle">
      台南牛肉湯推廣網站｜RWD 響應式網頁設計主視覺 / 品牌周邊宣傳圖
    </text>
    <text x="320" y="80" font-family="'Courier New', monospace" font-size="11" fill="#A89887" text-anchor="middle">
      建議圖片路徑：images/works/work05-beefsoup.png
    </text>
  </g>
</svg>

